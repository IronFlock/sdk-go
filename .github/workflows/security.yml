# Security screening from the shared IronFlock CI harness: secrets, Go
# dependencies (govulncheck via `just sarif`), semgrep, configuration,
# licences and the SBOM (`just sbom`). A library: no image. Findings also go
# to the repository's Security tab.
#
# Blocking from the start (the cleanup came first): the `report` job fails on
# secrets, fixable high/critical vulnerabilities, high misconfigurations,
# forbidden licences and semgrep errors. Accepted findings go into
# .trivyignore.yaml / security/vex.openvex.json / .gitleaks.toml with a reason.
name: security

on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays 07:41 UTC: catch CVEs disclosed against unchanged code.
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: IronFlock/workflows/.github/workflows/security.yml@v1
    permissions:
      contents: read
      security-events: write
    with:
      languages: go
      # gosec runs in `just lint`; semgrep adds only the IronFlock rules.
      semgrep-rulesets: ""
      sarif-recipe: sarif
      sbom-recipe: sbom
      fail-on: secrets,vuln-critical,vuln-high,misconfig-high,license-forbidden,semgrep-error
