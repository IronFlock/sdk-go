# Pull requests into main only: the ruleset lets nothing reach main without
# ci-ok. The release intent decides whether the merge releases.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint (gofmt, tidy, vet, golangci-lint with gosec), unit tests under race +
  # shuffle, and cross-builds for the device platforms, from the shared
  # IronFlock CI harness.
  gate:
    uses: IronFlock/workflows/.github/workflows/go-gate.yml@v1
    with:
      # IronFlock devices are often 32-bit ARM.
      targets: |
        linux/arm
        linux/arm64
        linux/386
        windows/amd64
        darwin/arm64

  workflows:
    uses: IronFlock/workflows/.github/workflows/workflows-lint.yml@v1

  # The version decides: a bump makes a release PR (`just release-patch`,
  # title `release sdk-go v<version>`), an unchanged version a no-release PR
  # (`just merge`) whose merge releases nothing.
  intent:
    uses: IronFlock/workflows/.github/workflows/release-intent.yml@v1
    with:
      version-file: VERSION

  harness:
    # The integration harness without a router (integration/README.md): the
    # fake platform checked against the real services' contract tables, the
    # harness scripts, and the fake platform starting up on the oldest and the
    # newest supported Python.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Fake platform against the contract tables
        run: python -I integration/test_fake_platform.py -v
      - name: Harness scripts
        run: integration/router/test_scripts.sh
      - name: Shellcheck
        if: matrix.python == '3.14'
        run: |
          shellcheck -x --source-path=SCRIPTDIR integration/router/*.sh integration/contracts/regen.sh
      - name: Install the Python SDK (brings autobahn for the fake platform)
        run: python -m pip install ironflock==1.9.1
      - name: The fake platform starts
        # No router: it keeps retrying the closed port. -W error turns the
        # event-loop deprecation of Python 3.12/3.13 (an error on 3.14) into a
        # failure.
        run: |
          FAKE_PLATFORM_ROUTER=ws://127.0.0.1:9/ws-svc FAKE_PLATFORM_S3_PORT=18999 \
            python -I -W error::DeprecationWarning integration/fake_platform.py > fake_platform.log 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            cat fake_platform.log
            exit 1
          fi
          kill "$pid"

  integration:
    # End-to-end against the router image and a fake IronFlock
    # platform (integration/README.md); the Python SDK's run of the same
    # scenario is the wire-level reference. Pulling the image from Artifact
    # Registry needs workload identity federation: the job runs once the
    # ROUTER_PULL_WIF_PROVIDER and ROUTER_PULL_SERVICE_ACCOUNT repository
    # variables are set (integration/README.md, "CI setup"), and only for
    # pull requests from this repository (fork pull requests get no OIDC
    # token) and runs by hand.
    if: >-
      vars.ROUTER_PULL_WIF_PROVIDER != '' && vars.ROUTER_PULL_SERVICE_ACCOUNT != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ROUTER_IMAGE: ${{ vars.ROUTER_IMAGE || 'europe-docker.pkg.dev/record-1283/eu.gcr.io/router:v0.8.7' }}
      PYTHON: python
      IRONFLOCK_TEST_PLATFORM_URL: ws://localhost:18082/ws-ua-usr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the Python SDK (reference SDK and fake platform)
        # PyYAML lets start.sh verify the copied production roles.
        run: python -m pip install ironflock==1.9.1 pyyaml==6.0.3
      - id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.ROUTER_PULL_WIF_PROVIDER }}
          service_account: ${{ vars.ROUTER_PULL_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: europe-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}
      - name: Start the router and the fake platform
        run: integration/router/start.sh
      - name: Python reference run
        env:
          # The device identity the fake platform admits.
          DEVICE_SERIAL_NUMBER: 06a0bf96-a539-4d6a-8471-ac7adc67616e
          SWARM_KEY: "2"
          APP_KEY: "26"
          ENV: DEV
          DEVICE_KEY: "42"
          APP_NAME: interop
          DEVICE_NAME: interop-dev
        run: |
          cp -R integration/router/perapp_env "$RUNNER_TEMP/perapp_env"
          IRONFLOCK_ENV_DIR="$RUNNER_TEMP/perapp_env" python -I integration/py_scenario.py "$RUNNER_TEMP/py_reference.json"
      - name: Real-router tests of package wamp
        env:
          IRONFLOCK_TEST_ROUTER_URL: ws://localhost:18082/ws-ua-usr
        run: go test -race -count=1 -run TestRealRouter -v ./wamp/
      - name: Integration tests
        env:
          IRONFLOCK_TEST_ENV_DIR: ${{ github.workspace }}/integration/router/perapp_env
          IRONFLOCK_TEST_REFERENCE: ${{ runner.temp }}/py_reference.json
          IRONFLOCK_TEST_PYTHON: python
          # Relative to integration/, where go test runs the test.
          IRONFLOCK_TEST_RESTART_ROUTER: router/restart.sh
        run: go test -tags integration -race -count=1 -v ./integration/...
      - name: Stop the harness
        if: always()
        run: integration/router/stop.sh
      - name: Harness logs
        if: failure()
        run: |
          for log in router fake_platform; do
            f="integration/router/.run/$log.log"
            if [ -f "$f" ]; then echo "::group::$log.log"; tail -n 300 "$f"; echo "::endgroup::"; fi
          done

  # The required check of the main-branch ruleset: green only when every job
  # above succeeded. integration may be skipped (no router-pull identity
  # configured, or a pull request from a fork); anything else skipped or
  # cancelled counts as failed.
  ci-ok:
    if: ${{ always() }}
    needs: [gate, workflows, intent, harness, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: all ci jobs succeeded
        env:
          REQUIRED: ${{ needs.gate.result }} ${{ needs.workflows.result }} ${{ needs.intent.result }} ${{ needs.harness.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "required: $REQUIRED, integration: $INTEGRATION"
          for r in $REQUIRED; do [ "$r" = success ] || exit 1; done
          case "$INTEGRATION" in success|skipped) ;; *) exit 1 ;; esac
